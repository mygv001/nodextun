zerops:
  - setup: nodextun
    build:
      base: alpine/nodejs@22
      buildCommands:
        - npm install
      deployFiles:
        - index.js
        - index.html
        - package.json
        - package-lock.json
        - node_modules
      cache:
        - node_modules
      run:
        base: alpine/nodejs@22
        ports:
        - port: 3000
          httpSupport: true
        start: npm start
